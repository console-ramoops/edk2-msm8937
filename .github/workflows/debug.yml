name: C/C++ CI

on:
  push:
    branches: [ "sdcard", "santoni-aarch64" ]
  pull_request:
    branches: [ "sdcard", "santoni-aarch64" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.1.5
    - name: CI Build
      run: chmod +x ci-build.sh && ./ci-build.sh

    - uses: actions/upload-artifact@v4
      with:
        name: boot-santoni
        path: boot-santoni.img